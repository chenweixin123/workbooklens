name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'chenweixin123/workbooklens'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.project.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Read project version
        id: project
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
      - name: Validate tag and project version
        if: github.ref_type == 'tag'
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
      - run: uv sync --locked --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python -m pytest -q
      - run: uv build --out-dir dist
      - run: uvx --from twine twine check --strict dist/*
      - run: python scripts/check_release_artifacts.py dist --version ${{ steps.project.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: workbooklens-python-distributions-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  portable:
    if: github.repository == 'chenweixin123/workbooklens'
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: workbooklens-python-distributions-${{ github.run_id }}
          path: dist
      - name: Export locked portable constraints
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts | Out-Null
          uv export --locked --python 3.12 --no-dev --group portable --no-emit-project --no-hashes --no-header --no-annotate --output-file .artifacts/portable-constraints.txt
      - name: Build Windows x64 portable ZIP from the wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheels.Count)."
          }
          $python = (Get-Command python.exe).Source
          & $python scripts/build_portable_windows.py --wheel $wheels[0].FullName --python $python --expected-version ${{ needs.verify.outputs.version }} --constraints .artifacts/portable-constraints.txt --output-dir portable-dist
      - name: Inspect and smoke-test the frozen artifact
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath portable-dist -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable ZIP, found $($archives.Count)."
          }
          $python = (Get-Command python.exe).Source
          & $python scripts/check_portable_artifact.py $archives[0].FullName --expected-version ${{ needs.verify.outputs.version }}
          & $python scripts/smoke_portable.py $archives[0].FullName --expected-version ${{ needs.verify.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: workbooklens-windows-portable-${{ github.run_id }}
          path: |
            portable-dist/*.zip
            portable-dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  assemble:
    if: github.repository == 'chenweixin123/workbooklens'
    needs: [verify, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workbooklens-python-distributions-${{ github.run_id }}
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: workbooklens-windows-portable-${{ github.run_id }}
          path: release
      - name: Validate the combined candidate and create SHA256SUMS
        shell: python
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          import hashlib
          import os
          import pathlib

          directory = pathlib.Path("release")
          version = os.environ["VERSION"]
          payload_names = {
              f"workbooklens-{version}-py3-none-any.whl",
              f"workbooklens-{version}.tar.gz",
              f"WorkbookLens-{version}-windows-x64-portable.zip",
          }
          sidecar_name = f"WorkbookLens-{version}-windows-x64-portable.zip.sha256"
          expected = payload_names | {sidecar_name}
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"combined candidate mismatch; expected {sorted(expected)}, got {sorted(actual)}"
              )

          portable = directory / f"WorkbookLens-{version}-windows-x64-portable.zip"
          portable_digest = hashlib.sha256(portable.read_bytes()).hexdigest()
          sidecar = (directory / sidecar_name).read_text(encoding="ascii").strip()
          if sidecar != f"{portable_digest}  {portable.name}":
              raise SystemExit("portable SHA256 sidecar does not match the ZIP")

          lines = []
          for name in sorted(payload_names, key=str.casefold):
              path = directory / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          (directory / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
              newline="\n",
          )
      - uses: actions/upload-artifact@v7
        with:
          name: workbooklens-release-candidate-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 30
